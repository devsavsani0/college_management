{% extends 'base.html' %}
{% block title %}Add Faculty | EduManage{% endblock %}
{% block content %}<div class="page-heading"><div><h1>Add Faculty</h1><p>Create a faculty member record</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field"><label>Employee ID</label><input name="employee_id" required></div><div class="field"><label>Full Name</label><input name="name" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Department</label><input name="department" required></div><div class="field"><label>Designation</label><input name="designation" required></div><div class="field full"><label>Joining Date</label><input type="date" name="joining_date" required></div></div><div class="actions"><button class="btn" type="submit">Save Faculty</button><a class="btn secondary" href="{% url 'faculty_list' %}">Cancel</a></div></form></div>{% endblock %}
