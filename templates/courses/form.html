{% extends 'base.html' %}
{% block title %}Add Course | EduManage{% endblock %}
{% block content %}<div class="page-heading"><div><h1>Add Course</h1><p>Create a new academic course</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field"><label>Course Code</label><input name="code" required></div><div class="field"><label>Course Name</label><input name="name" required></div><div class="field"><label>Department</label><input name="department" required></div><div class="field"><label>Credits</label><input type="number" name="credits" min="1" max="10" value="3" required></div><div class="field full"><label>Faculty</label><select name="faculty"><option value="">Not assigned</option>{% for f in faculty %}<option value="{{ f.id }}">{{ f.name }} - {{ f.department }}</option>{% endfor %}</select></div></div><div class="actions"><button class="btn" type="submit">Save Course</button><a class="btn secondary" href="{% url 'course_list' %}">Cancel</a></div></form></div>{% endblock %}
