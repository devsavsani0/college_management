{% extends 'base.html' %}
{% block title %}Add Student | EduManage{% endblock %}
{% block content %}<div class="page-heading"><div><h1>Add Student</h1><p>Create a new student record</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field"><label>Student ID</label><input name="student_id" required></div><div class="field"><label>Full Name</label><input name="name" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Gender</label><select name="gender"><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Department</label><input name="department" required></div><div class="field"><label>Year</label><input type="number" name="year" min="1" max="8" value="1" required></div><div class="field"><label>Status</label><select name="status"><option>Active</option><option>Inactive</option></select></div></div><div class="actions"><button class="btn" type="submit">Save Student</button><a class="btn secondary" href="{% url 'student_list' %}">Cancel</a></div></form></div>{% endblock %}
