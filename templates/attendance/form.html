{% extends 'base.html' %}
{% block title %}Record Attendance | EduManage{% endblock %}
{% block content %}<div class="page-heading"><div><h1>Record Attendance</h1><p>Mark a student's attendance</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field"><label>Student</label><select name="student" required><option value="">Select student</option>{% for s in students %}<option value="{{ s.id }}">{{ s.student_id }} - {{ s.name }}</option>{% endfor %}</select></div><div class="field"><label>Course</label><select name="course" required><option value="">Select course</option>{% for c in courses %}<option value="{{ c.id }}">{{ c.code }} - {{ c.name }}</option>{% endfor %}</select></div><div class="field"><label>Date</label><input type="date" name="date" required></div><div class="field"><label>Status</label><select name="status"><option>Present</option><option>Absent</option><option>Late</option></select></div></div><div class="actions"><button class="btn" type="submit">Save Record</button><a class="btn secondary" href="{% url 'attendance_list' %}">Cancel</a></div></form></div>{% endblock %}
