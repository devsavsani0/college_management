{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | EduManage</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body class="login-body"><form class="login-card" method="post">{% csrf_token %}<div class="brand-mark">🎓</div><h1>Welcome back</h1>{% if messages %}<div class="messages">{% for message in messages %}<div class="message" style="background:#fff0f0;color:#b54747">{{ message }}</div>{% endfor %}</div>{% endif %}<div class="field"><label>Username</label><input name="username" required autofocus></div><div class="field"><label>Password</label><input type="password" name="password" required></div><button class="btn" type="submit">Sign in</button></form></body></html>
